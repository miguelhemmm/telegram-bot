version = 0.1

[default.global.parameters]
stack_name = "telegram-gta6-reminder"
region = "us-east-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
resolve_s3 = true
s3_prefix = "telegram-gta6-reminder"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
# Secrets (TelegramToken, ChatId) are passed on the CLI via --parameter-overrides.

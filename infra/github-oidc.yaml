AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap: GitHub Actions OIDC provider + deploy role.
  Lets a specific GitHub repo/branch assume a role in this account
  without long-lived access keys. Deploy once by hand (see README).

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub user or organization that owns the repo (e.g. miguelhemmm).
  RepoName:
    Type: String
    Description: Repository name (e.g. aws-projects).
  Branch:
    Type: String
    Default: main
    Description: Only workflows running on this branch may assume the role.
  RoleName:
    Type: String
    Default: github-actions-deploy
  StackNamePrefix:
    Type: String
    Default: telegram-
    Description: The deploy role may only touch CloudFormation stacks / IAM roles starting with this prefix.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # AWS now validates GitHub's cert chain itself; the field is still required.
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Assumed by GitHub Actions to run `sam deploy`.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOidcProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${RepoName}:ref:refs/heads/${Branch}
      Policies:
        - PolicyName: sam-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Identity
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"

              - Sid: CloudFormationStacks
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackNamePrefix}*/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31

              - Sid: CloudFormationRead
                Effect: Allow
                Action:
                  - cloudformation:ListStacks
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: "*"

              # `sam deploy --resolve-s3` creates/uses the managed artifacts bucket.
              - Sid: SamArtifactsBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetBucket*
                  - s3:PutBucket*
                  - s3:ListBucket
                  - s3:GetObject*
                  - s3:PutObject*
                  - s3:DeleteObject*
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                Resource:
                  - arn:aws:s3:::aws-sam-cli-managed-default-*
                  - arn:aws:s3:::aws-sam-cli-managed-default-*/*

              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackNamePrefix}*

              - Sid: EventBridge
                Effect: Allow
                Action: events:*
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${StackNamePrefix}*

              - Sid: Logs
                Effect: Allow
                Action: logs:*
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${StackNamePrefix}*

              # SAM creates the Lambda execution role; CFN names it <stack>-<logicalId>-<hash>.
              - Sid: LambdaExecutionRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${StackNamePrefix}*

Outputs:
  RoleArn:
    Description: Store this as the GitHub secret AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubActionsDeployRole.Arn
  OidcProviderArn:
    Value: !GetAtt GitHubOidcProvider.Arn
